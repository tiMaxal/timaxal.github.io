    <style>
        /* Base styles - consistent across all pages */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ccffff;
            color: #3404f4;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Dark theme colors */
        body.dark-theme {
            background-color: #003366;
            color: #99ddff;
        }

        /* Black theme colors */
        body.black-theme {
            background-color: #000000;
            color: #ffffff;
        }

        /* Link colors for light theme */
        a:link { color: #0000ee; }
        a:visited { color: #551a8b; }
        a:active { color: #ee0000; }
        a:hover { 
            color: #3404f4;
            text-decoration: underline;
        }

        /* Link colors for dark theme */
        body.dark-theme a:link { color: #66bbff; }
        body.dark-theme a:visited { color: #9988ff; }
        body.dark-theme a:hover { color: #99ddff; }

        /* Link colors for black theme */
        body.black-theme a:link { color: #66bbff; }
        body.black-theme a:visited { color: #9999ff; }
        body.black-theme a:hover { color: #ffffff; }

        /* Main container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Headings */
        h1 {
            font-size: 2.5em;
            margin: 30px 0;
            text-align: center;
        }

        h2 {
            font-size: 1.8em;
            margin: 30px 0 20px 0;
            border-bottom: 2px solid currentColor;
            padding-bottom: 10px;
        }

        h3 {
            font-size: 1.4em;
            margin: 25px 0 15px 0;
        }

        /* Intro text */
        .intro {
            text-align: center;
            margin: 20px 0 40px 0;
            font-size: 1.1em;
        }

        /* Info box styling */
        .info-box {
            background-color: rgba(52, 4, 244, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 25px 0;
            border-left: 4px solid currentColor;
        }

        body.dark-theme .info-box {
            background-color: rgba(153, 221, 255, 0.1);
        }

        body.black-theme .info-box {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Content section */
        .content-section {
            margin: 25px 0;
            padding: 15px;
            background-color: rgba(52, 4, 244, 0.05);
            border-radius: 8px;
        }

        body.dark-theme .content-section {
            background-color: rgba(153, 221, 255, 0.08);
        }

        body.black-theme .content-section {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Theme switcher button */
        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: rgba(52, 4, 244, 0.8);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.9em;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .theme-switcher:hover {
            transform: scale(1.05);
        }

        body.dark-theme .theme-switcher {
            background-color: rgba(153, 221, 255, 0.8);
            color: #003366;
        }

        body.black-theme .theme-switcher {
            background-color: rgba(255, 255, 255, 0.8);
            color: #000000;
        }

        /* ✏️ ADD YOUR CUSTOM STYLES BELOW THIS LINE */
        
        /* Example custom styles you might add:
        
        .my-special-box {
            border: 2px solid currentColor;
            padding: 15px;
            margin: 20px 0;
        }
        
        */
    </style>

<h1>Software by tiMaxal</h1>
<style>
  .container {
    max-width: 1200px;
  }

  .intro {
    text-align: center;
    margin: 20px 0 40px 0;
    font-size: 1.1em;
  }

  .repo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 25px;
    margin: 30px 0;
  }

  .repo-card {
    border: 2px solid currentColor;
    border-radius: 8px;
    padding: 20px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .repo-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  }

  .repo-card h3 {
    font-size: 1.3em;
    margin-bottom: 10px;
  }

  .repo-card h3 a {
    color: inherit;
    text-decoration: none;
  }

  .repo-card h3 a:hover {
    text-decoration: underline;
  }

  .repo-description {
    margin: 15px 0;
    min-height: 50px;
  }

  .repo-meta {
    display: flex;
    gap: 15px;
    margin-top: 15px;
    font-size: 0.9em;
    opacity: 0.8;
  }

  .repo-language {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .language-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .repo-stars {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .loading {
    text-align: center;
    padding: 40px;
    font-size: 1.2em;
    opacity: 0.7;
  }

  .last-updated {
    text-align: center;
    font-size: 0.9em;
    opacity: 0.6;
    margin: 20px 0;
  }

  .error-message {
    text-align: center;
    padding: 20px;
    color: #ff0000;
    background-color: rgba(255, 0, 0, 0.1);
    border-radius: 8px;
    margin: 20px 0;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
  }

  .control-btn {
    padding: 8px 16px;
    border: 2px solid currentColor;
    border-radius: 5px;
    background-color: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 0.9em;
    transition: all 0.2s ease;
  }

  .control-btn:hover {
    background-color: rgba(52, 4, 244, 0.1);
    transform: scale(1.05);
  }

  body.dark-theme .control-btn:hover {
    background-color: rgba(153, 221, 255, 0.1);
  }

  body.black-theme .control-btn:hover {
    background-color: rgba(255, 255, 255, 0.1);
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 30px 0 20px 0;
    border-bottom: 2px solid currentColor;
    padding-bottom: 10px;
  }

  .header-row h2 {
    margin: 0;
    border: none;
    padding: 0;
  }

  @media (max-width: 768px) {
    .repo-grid {
      grid-template-columns: 1fr;
    }

    .controls {
      flex-direction: column;
      align-items: flex-start;
    }

    .header-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
  }

  .footer {
    text-align: center;
    margin-top: 50px;
    padding: 30px 20px;
    border-top: 2px solid currentColor;
  }

  .footer p {
    margin: 10px 0;
  }

  .footer img {
    margin: 0 10px;
    vertical-align: middle;
  }

  .footer h6 {
    margin-top: 20px;
    font-size: 0.9em;
  }
</style>
