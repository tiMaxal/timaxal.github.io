<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV AU - Check Local UV Levels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ccffff;
            color: #3404f4;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark-theme {
            background-color: #003366;
            color: #99ddff;
        }

        body.black-theme {
            background-color: #000000;
            color: #ffffff;
        }

        a:link { color: #0000ee; }
        a:visited { color: #551a8b; }
        a:active { color: #ee0000; }
        a:hover { 
            color: #3404f4;
            text-decoration: underline;
        }

        body.dark-theme a:link { color: #66bbff; }
        body.dark-theme a:visited { color: #9988ff; }
        body.dark-theme a:hover { color: #99ddff; }

        body.black-theme a:link { color: #66bbff; }
        body.black-theme a:visited { color: #9999ff; }
        body.black-theme a:hover { color: #ffffff; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin: 30px 0;
            text-decoration: underline;
        }

        iframe {
            margin: 20px 0;
            border: 2px solid currentColor;
            border-radius: 8px;
        }

        .info-box {
            margin: 30px auto;
            padding: 20px;
            background-color: rgba(52, 4, 244, 0.05);
            border-radius: 10px;
            border: 2px solid currentColor;
        }

        body.dark-theme .info-box {
            background-color: rgba(153, 221, 255, 0.08);
        }

        body.black-theme .info-box {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: rgba(52, 4, 244, 0.8);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.9em;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .theme-switcher:hover {
            transform: scale(1.05);
        }

        body.dark-theme .theme-switcher {
            background-color: rgba(153, 221, 255, 0.8);
            color: #003366;
        }

        body.black-theme .theme-switcher {
            background-color: rgba(255, 255, 255, 0.8);
            color: #000000;
        }
    </style>
    <link rel="stylesheet" href="../helpers/site-nav.css?v=2">
    <script src="../helpers/theme-switcher.js?v=2"></script>
    <script src="../helpers/footer-loader.js?v=2"></script>
    <script src="../helpers/site-nav.js?v=2"></script>

<link rel="icon" type="image/png" href="../imgs/TM.favicon.20260201.png">
</head>
<body>
    <button id="themeBtn" class="theme-switcher" onclick="cycleTheme()">☀️ Light</button>
    
    <div class="container">
        <h1>Check Local UV Levels</h1>

        <iframe id="uvindexwidget" 
                src="https://www.sunsmart.com.au/uvalert/default.asp?version=australia&locationid=23"
                width="170" 
                height="300" 
                frameborder="0" 
                scrolling="no" 
                allowtransparency="true">
        </iframe>

        <div class="info-box">
            <h6><b><a href="https://hns.au" target="_blank">.uvau/</a></b> is a Handshake Domain</h6>
            <p>Website presented by HNSau</p>
        </div>

        <div id="footer-container"></div>
    </div>
</body>
</html>
