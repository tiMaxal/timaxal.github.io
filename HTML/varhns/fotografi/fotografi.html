    <title>fotografi</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background-color: #ccffff; color: #3404f4; font-family: Arial, Helvetica, sans-serif; line-height: 1.6; padding: 20px; transition: background-color 0.3s ease, color 0.3s ease; }
      body.dark-theme { background-color: #003366; color: #99ddff; }
      body.black-theme { background-color: #000000; color: #ffffff; }
      a:link { color: #0000ee; }
      a:visited { color: #551a8b; }
      a:active { color: #ee0000; }
      a:hover { color: #3404f4; text-decoration: underline; }
      body.dark-theme a:link { color: #66bbff; }
      body.dark-theme a:visited { color: #9988ff; }
      body.dark-theme a:hover { color: #99ddff; }
      body.black-theme a:link { color: #66bbff; }
      body.black-theme a:visited { color: #9999ff; }
      body.black-theme a:hover { color: #ffffff; }
      .theme-switcher { position: fixed; top: 20px; right: 20px; padding: 10px 20px; background-color: rgba(52, 4, 244, 0.8); color: white; border: none; border-radius: 20px; cursor: pointer; font-family: Arial, Helvetica, sans-serif; font-size: 0.9em; font-weight: bold; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3); transition: all 0.3s ease; z-index: 1000; }
      .theme-switcher:hover { transform: scale(1.05); }
      body.dark-theme .theme-switcher { background-color: rgba(153, 221, 255, 0.8); color: #003366; }
      body.black-theme .theme-switcher { background-color: rgba(255, 255, 255, 0.8); color: #000000; }
      .container { max-width: 900px; margin: 0 auto; padding: 30px; text-align: center; }
      h2 { margin: 20px 0; font-size: 1.8em; }
      .link-section { margin: 25px 0; }
      .footer { margin-top: 50px; padding-top: 30px; border-top: 2px solid currentColor; }
      .footer img { margin: 10px 5px; transition: transform 0.3s ease; }
      .footer img:hover { transform: scale(1.1); }
      .footer h6 { margin-top: 20px; font-size: 0.9em; opacity: 0.8; }
    </style>
