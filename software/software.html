<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software by tiMaxal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #ccffff;
            color: #3404f4;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark-theme {
            background-color: #003366;
            color: #99ddff;
        }

        body.black-theme {
            background-color: #000000;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5em;
            margin: 30px 0;
            text-align: center;
        }

        h2 {
            font-size: 1.8em;
            margin: 30px 0 20px 0;
            border-bottom: 2px solid currentColor;
            padding-bottom: 10px;
        }

        .intro {
            text-align: center;
            margin: 20px 0 40px 0;
            font-size: 1.1em;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }

        .repo-card {
            border: 2px solid currentColor;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .repo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .repo-card h3 {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .repo-card h3 a {
            color: inherit;
            text-decoration: none;
        }

        .repo-card h3 a:hover {
            text-decoration: underline;
        }

        .repo-description {
            margin: 15px 0;
            min-height: 50px;
        }

        .repo-meta {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .repo-language {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .language-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .repo-stars {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border: 2px solid currentColor;
            border-radius: 5px;
            background-color: inherit;
            color: inherit;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        #theme-switcher:hover {
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            opacity: 0.7;
        }

        .last-updated {
            text-align: center;
            font-size: 0.9em;
            opacity: 0.6;
            margin: 20px 0;
        }

        .error-message {
            text-align: center;
            padding: 20px;
            color: #ff0000;
            background-color: rgba(255, 0, 0, 0.1);
            border-radius: 8px;
            margin: 20px 0;
        }

        /* Control buttons */
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-btn {
            padding: 8px 16px;
            border: 2px solid currentColor;
            border-radius: 5px;
            background-color: transparent;
            color: inherit;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background-color: rgba(52, 4, 244, 0.1);
            transform: scale(1.05);
        }

        body.dark-theme .control-btn:hover {
            background-color: rgba(153, 221, 255, 0.1);
        }

        body.black-theme .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 20px 0;
            border-bottom: 2px solid currentColor;
            padding-bottom: 10px;
        }

        .header-row h2 {
            margin: 0;
            border: none;
            padding: 0;
        }

        @media (max-width: 768px) {
            .repo-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2em;
            }

            #theme-switcher {
                top: 10px;
                right: 10px;
                padding: 8px 15px;
                font-size: 0.9em;
            }

            .site-nav {
                top: 10px;
                left: 10px;
            }

            .controls {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 30px 20px;
            border-top: 2px solid currentColor;
        }

        .footer p {
            margin: 10px 0;
        }

        .footer img {
            margin: 0 10px;
            vertical-align: middle;
        }

        .footer h6 {
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
    <link rel="stylesheet" href="../site-helpers/site-nav.css?v=2">
    <script src="../site-helpers/theme-switcher.js?v=2"></script>
    <script src="../site-helpers/footer-loader.js?v=2"></script>
    <script src="../site-helpers/site-nav.js?v=2"></script>
</head>
<body>
    <button id="theme-switcher" onclick="cycleTheme()">☀️ Light</button>
    
    <div class="container">
        <h1>Software by tiMaxal</h1>
        
        <div class="intro">
            <p>Open source projects and tools developed by tiMaxal.</p>
            <p>Explore the repositories on <a href="https://github.com/tiMaxal" target="_blank">GitHub</a>.</p>
            <p class="last-updated" id="lastUpdated"></p>
        </div>

        <div class="header-row">
            <h2>🛠️ Original Projects</h2>
            <div class="controls">
                <button class="control-btn" id="sortBtn" onclick="toggleSort()">📅 Most Recent</button>
                <button class="control-btn" id="refreshBtn" onclick="forceRefresh()">🔄 Refresh</button>
                <a href="https://github.com/tiMaxal" target="_blank" class="control-btn" style="text-decoration: none;">→ View All</a>
            </div>
        </div>
        
        <div class="repo-grid" id="repoGrid">
            <div class="loading">Loading repositories...</div>
        </div>

        <div id="footer-container"></div>
    </div>

    <script>
        // GitHub API configuration
        const GITHUB_USERNAME = 'tiMaxal';
        const CACHE_KEY = 'github_repos_cache';
        const CACHE_DURATION = 86400000; // 24 hours in milliseconds
        const MIN_REFRESH_INTERVAL = 3600000; // 1 hour minimum for forced refresh
        const LAST_REFRESH_KEY = 'last_manual_refresh';
        
        // Repositories to ignore
        const IGNORE_REPOS = [
            'hello-world',
            'timaxal.github.io',
            'timaskal.github.io'
        ];
        
        // Sort state
        let currentSort = 'recent'; // 'recent' or 'alpha'
        
        // Language colors from GitHub
        const languageColors = {
            'Python': '#3572A5',
            'JavaScript': '#f1e05a',
            'HTML': '#e34c26',
            'CSS': '#563d7c',
            'TypeScript': '#2b7489',
            'Java': '#b07219',
            'C': '#555555',
            'C++': '#f34b7d',
            'C#': '#178600',
            'PHP': '#4F5D95',
            'Ruby': '#701516',
            'Go': '#00ADD8',
            'Rust': '#dea584',
            'Shell': '#89e051',
            'Vue': '#41b883'
        };

        // Check if cached data is still valid
        function getCachedData() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_DURATION) {
                        return data;
                    }
                }
            } catch (e) {
                console.error('Cache read error:', e);
            }
            return null;
        }

        // Save data to cache
        function cacheData(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    data: data,
                    timestamp: Date.now()
                }));
            } catch (e) {
                console.error('Cache write error:', e);
            }
        }

        // Fetch repositories from GitHub API
        async function fetchRepositories() {
            try {
                const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`);
                
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
                
                const repos = await response.json();
                
                // Filter non-forked repos and ignored repos
                const originalRepos = repos
                    .filter(repo => !repo.fork && !IGNORE_REPOS.includes(repo.name))
                    .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
                
                return originalRepos;
            } catch (error) {
                console.error('Error fetching repositories:', error);
                throw error;
            }
        }

        // Create repo card HTML
        function createRepoCard(repo) {
            const languageColor = languageColors[repo.language] || '#cccccc';
            const stars = repo.stargazers_count > 0 ? `<span class="repo-stars">⭐ ${repo.stargazers_count}</span>` : '';
            const license = repo.license ? `<span>${repo.license.spdx_id}</span>` : '';
            const description = repo.description || 'No description available';
            const language = repo.language || 'Unknown';
            
            return `
                <div class="repo-card">
                    <h3><a href="${repo.html_url}" target="_blank">${repo.name}</a></h3>
                    <div class="repo-description">${description}</div>
                    <div class="repo-meta">
                        <span class="repo-language">
                            <span class="language-dot" style="background-color: ${languageColor};"></span>
                            ${language}
                        </span>
                        ${stars}
                        ${license}
                    </div>
                </div>
            `;
        }

        // Sort repositories
        function sortRepos(repos, sortType) {
            const sorted = [...repos];
            if (sortType === 'alpha') {
                sorted.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
            } else {
                sorted.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            }
            return sorted;
        }

        // Toggle sort
        function toggleSort() {
            currentSort = currentSort === 'recent' ? 'alpha' : 'recent';
            const sortBtn = document.getElementById('sortBtn');
            sortBtn.textContent = currentSort === 'recent' ? '📅 Most Recent' : '🔤 Alphabetical';
            
            const cachedRepos = getCachedData();
            if (cachedRepos) {
                updateRepoGrid(sortRepos(cachedRepos, currentSort));
            }
        }

        // Force refresh with 1-hour minimum interval
        async function forceRefresh() {
            const lastRefresh = localStorage.getItem(LAST_REFRESH_KEY);
            const now = Date.now();
            
            if (lastRefresh && (now - parseInt(lastRefresh)) < MIN_REFRESH_INTERVAL) {
                const remainingTime = Math.ceil((MIN_REFRESH_INTERVAL - (now - parseInt(lastRefresh))) / 60000);
                alert(`Please wait ${remainingTime} more minute(s) before refreshing again.`);
                return;
            }
            
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;
            refreshBtn.textContent = '⏳ Refreshing...';
            
            try {
                const repos = await fetchRepositories();
                updateRepoGrid(sortRepos(repos, currentSort));
                cacheData(repos);
                localStorage.setItem(LAST_REFRESH_KEY, now.toString());
            } catch (error) {
                showError('Failed to refresh repositories.');
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 Refresh';
            }
        }

        // Update the repository grid
        function updateRepoGrid(repos) {
            const grid = document.getElementById('repoGrid');
            
            if (repos && repos.length > 0) {
                const sortedRepos = sortRepos(repos, currentSort);
                grid.innerHTML = sortedRepos.map(repo => createRepoCard(repo)).join('');
                
                // Update last updated timestamp
                const lastUpdated = document.getElementById('lastUpdated');
                lastUpdated.textContent = `Last updated: ${new Date().toLocaleString()}`;
            } else {
                grid.innerHTML = '<div class="error-message">No repositories found.</div>';
            }
        }

        // Show error message
        function showError(message) {
            const grid = document.getElementById('repoGrid');
            grid.innerHTML = `<div class="error-message">${message}</div>`;
        }

        // Main initialization function
        async function initializeRepos() {
            // Try to load from cache first
            const cachedRepos = getCachedData();
            
            if (cachedRepos) {
                updateRepoGrid(cachedRepos);
                
                // Update last updated time from cache
                const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
                const lastUpdated = document.getElementById('lastUpdated');
                lastUpdated.textContent = `Last updated: ${new Date(cached.timestamp).toLocaleString()} (cached)`;
            }
            
            // Fetch fresh data in the background
            try {
                const repos = await fetchRepositories();
                updateRepoGrid(repos);
                cacheData(repos);
            } catch (error) {
                // If we have cached data, keep using it
                if (!cachedRepos) {
                    showError('Failed to load repositories. Please try again later.');
                }
            }
        }

        // Auto-refresh daily
        setInterval(initializeRepos, CACHE_DURATION);

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeRepos);
    </script>
</body>
</html>
